name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd /opt/Assistext
            # Force git to match the remote, overwriting untracked files
            git fetch origin
            git reset --hard origin/main
            
            # Make sure script is executable
            chmod +x deploy.sh
            ./deploy.sh
